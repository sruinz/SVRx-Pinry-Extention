<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="optionsTitle">SVRx Pinry settings</title>
    <style>
      body { font-family: sans-serif; max-width: 42rem; margin: 2rem; }
      label { display: block; margin: 1rem 0; }
      input[type="text"], input[type="password"] { box-sizing: border-box; width: 100%; }
      .notice { color: #555; }
      .field-error { color: #b42318; display: block; min-height: 1.25em; margin: 0.25rem 0 0; }
      .danger { color: #b42318; }
      .delete-confirmation { border: 1px solid #b42318; margin-top: 1rem; padding: 1rem; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1 data-i18n="serverHeading">SVRx Pinry server</h1>
    <section id="serverState" aria-live="polite">
      <h2 data-i18n="connectionStatusHeading">Connection status</h2>
      <p id="serverConnectionStatus" data-i18n="statusChecking">Checking status</p>
      <p id="serverOrigin"></p>
      <p id="serverUsername"></p>
      <p id="serverPermission"></p>
      <p id="serverTokenState"></p>
      <button type="button" id="revalidateServer" data-i18n="recheckConnection">Check connection again</button>
    </section>
    <form id="serverForm">
      <label>
        <span data-i18n="serverAddressLabel">Server address</span>
        <input type="text" id="pinryUrl" placeholder="https://pinry.example" required />
        <span id="pinryUrlError" class="field-error" aria-live="polite"></span>
      </label>
      <label>
        <span data-i18n="apiTokenLabel">API token</span>
        <input type="password" id="pinryToken" autocomplete="new-password" />
        <span id="pinryTokenError" class="field-error" aria-live="polite"></span>
      </label>
      <label>
        <input type="checkbox" id="allowInsecureHttp" />
        <span data-i18n="insecureHttpConsent">I understand and agree that using HTTP sends the token without encryption.</span>
      </label>
      <button type="submit" id="saveServerSettings" disabled data-i18n="saveAndAuthenticate">Save and authenticate</button>
      <button
        type="button"
        id="deleteCredentials"
        aria-controls="deleteCredentialsConfirmation"
        aria-expanded="false"
        class="danger"
        data-i18n="deleteCredentials"
      >Delete credentials</button>
      <section
        id="deleteCredentialsConfirmation"
        role="alertdialog"
        aria-labelledby="deleteCredentialsQuestion"
        hidden
        class="delete-confirmation"
      >
        <p id="deleteCredentialsQuestion"></p>
        <button type="button" id="confirmDeleteCredentials" class="danger" data-i18n="deleteButton">Delete</button>
        <button type="button" id="cancelDeleteCredentials" data-i18n="cancelButton">Cancel</button>
      </section>
    </form>
    <p class="notice" data-i18n="storageSecurityNotice">The extension's storage.local is not an operating-system secret store. Protect this browser profile.</p>
    <p id="status" tabindex="-1" aria-live="polite"></p>
    <label>
      <input type="checkbox" id="contextMenu" />
      <span data-i18n="showContextMenu">Show “Add to SVRx Pinry” in the right-click menu</span>
    </label>
    <script src="i18n.js"></script>
    <script src="origin.js"></script>
    <script src="options.js"></script>
  </body>
</html>
